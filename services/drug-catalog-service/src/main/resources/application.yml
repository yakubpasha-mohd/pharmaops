server:
  port: 8082

spring:
  application:
    name: drug-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: drug_catalog
  flyway:
    enabled: true
    schemas: drug_catalog
    locations: classpath:db/migration
jwt:
  secret: "${JWT_SECRET:default-dev-secret-key-must-be-32-chars}"
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.pharma: ${LOG_LEVEL:INFO}
